        // 量子涟漪动画
        function createQuantumRipple() {
            const container = document.getElementById('quantum-ripple');
            if (!container) return;
            
            const center = document.createElement('div');
            center.className = 'ripple-center';
            center.style.left = '50%';
            center.style.top = '50%';
            center.style.transform = 'translate(-50%, -50%)';
            container.appendChild(center);
            animationElements.push(center);
            
            const ripples = [];
            const colors = ['#ff00ff', '#00f7ff', '#ffffff', '#ffff00', '#00ff80'];
            
            function createRipple() {
                const ripple = document.createElement('div');
                ripple.className = 'ripple-circle';
                
                const color = colors[Math.floor(Math.random() * colors.length)];
                const size = Math.random() * 30 + 20;
                const width = Math.random() * 3 + 1;
                
                ripple.style.width = `${size}px`;
                ripple.style.height = `${size}px`;
                ripple.style.borderColor = color;
                ripple.style.color = color;
                ripple.style.left = `${Math.random() * 90 + 5}%`;
                ripple.style.top = `${Math.random() * 90 + 5}%`;
                ripple.style.borderWidth = `${width}px`;
                ripple.style.boxShadow = `0 0 ${width * 15}px ${color}`;
                
                container.appendChild(ripple);
                animationElements.push(ripple);
                
                ripples.push({
                    element: ripple,
                    x: parseFloat(ripple.style.left),
                    y: parseFloat(ripple.style.top),
                    size: size,
                    maxSize: Math.random() * 300 + 150,
                    speed: Math.random() * 0.8 + 0.3,
                    opacity: 1,
                    color: color,
                    life: 0,
                    maxLife: Math.random() * 100 + 150,
                    waveOffset: Math.random() * Math.PI * 2,
                    pulse: Math.random() * Math.PI * 2
                });
            }
            
            const initialRippleCount = isLowPerformanceMode ? 3 : 5;
            for (let i = 0; i < initialRippleCount; i++) {
                createRipple();
            }
            
            const rippleInterval = setInterval(() => {
                if (ripples.length < (isLowPerformanceMode ? 10 : 20)) {
                    createRipple();
                }
            }, isLowPerformanceMode ? 1200 : 800);
            
            animationIntervals.push(rippleInterval);
            
            let lastTime = 0;
            let frameCount = 0;
            
            function animateRipples(currentTime) {
                if (!lastTime) lastTime = currentTime;
                const deltaTime = Math.min(currentTime - lastTime, 100);
                
                frameCount++;
                const time = frameCount * 0.01;
                
                const centerPulse = 1 + Math.sin(time * 2) * 0.3;
                center.style.transform = `translate(-50%, -50%) scale(${centerPulse})`;
                
                ripples.forEach((ripple, index) => {
                    ripple.life += (deltaTime / 16);
                    ripple.size += ripple.speed * (deltaTime / 16);
                    
                    const waveX = Math.sin(time * 0.8 + ripple.waveOffset) * 10;
                    const waveY = Math.cos(time * 0.7 + ripple.waveOffset) * 10;
                    
                    ripple.pulse += 0.05;
                    const pulse = 1 + Math.sin(ripple.pulse) * 0.2;
                    
                    const currentX = ripple.x + waveX * (ripple.size / ripple.maxSize);
                    const currentY = ripple.y + waveY * (ripple.size / ripple.maxSize);
                    const currentSize = ripple.size * pulse;
                    
                    ripple.element.style.left = `${currentX}%`;
                    ripple.element.style.top = `${currentY}%`;
                    ripple.element.style.width = `${currentSize}px`;
                    ripple.element.style.height = `${currentSize}px`;
                    ripple.element.style.transform = `translate(-50%, -50%)`;
                    
                    const lifeRatio = ripple.life / ripple.maxLife;
                    ripple.opacity = 1 - lifeRatio;
                    ripple.element.style.opacity = ripple.opacity.toString();
                    
                    const hueShift = Math.sin(time * 0.5 + index * 0.1) * 60;
                    ripple.element.style.filter = `hue-rotate(${hueShift}deg) blur(${1 + lifeRatio * 3}px)`;
                    
                    if (ripple.life > ripple.maxLife) {
                        ripple.life = 0;
                        ripple.size = Math.random() * 30 + 20;
                        ripple.x = Math.random() * 90 + 5;
                        ripple.y = Math.random() * 90 + 5;
                        ripple.maxSize = Math.random() * 300 + 150;
                        ripple.speed = Math.random() * 0.8 + 0.3;
                        ripple.maxLife = Math.random() * 100 + 150;
                        ripple.waveOffset = Math.random() * Math.PI * 2;
                        
                        const newColor = colors[Math.floor(Math.random() * colors.length)];
                        ripple.color = newColor;
                        ripple.element.style.borderColor = newColor;
                        ripple.element.style.color = newColor;
                        ripple.element.style.boxShadow = `0 0 ${Math.random() * 3 + 1 * 15}px ${newColor}`;
                    }
                });
                
                lastTime = currentTime;
                animationFrameId = requestAnimationFrame(animateRipples);
            }
            
            animationFrameId = requestAnimationFrame(animateRipples);
        }

        // 绑定事件
        function bindEvents() {
            // 时间点击事件
            document.getElementById('time-container').addEventListener('click', speakTime);
            
            // 动画按钮
            document.getElementById('animation-btn').addEventListener('click', () => {
                const selector = document.getElementById('animation-selector');
                if (selector.classList.contains('show')) {
                    selector.classList.remove('show');
                } else {
                    selector.classList.add('show');
                    resetSelectorTimer();
                }
            });
            
            // 挂机按钮
            document.getElementById('hangup-btn').addEventListener('click', () => {
                document.getElementById('hangup-modal').style.display = 'flex';
                document.getElementById('hangup-password').value = '';
                document.getElementById('hangup-password').focus();
                
                const storedMessage = localStorage.getItem('hangupMessage') || '';
                document.getElementById('hangup-message').value = storedMessage;
                updateCharCounter();
                
                document.querySelectorAll('input[name="quick-option"]').forEach(radio => {
                    radio.checked = false;
                });
            });
            
            // 解锁按钮
            document.getElementById('unlock-btn').addEventListener('click', () => {
                if (!isShowingUnlockInput) {
                    document.getElementById('unlock-input-group').style.display = 'flex';
                    document.getElementById('unlock-password').focus();
                    document.getElementById('unlock-btn').style.display = 'none';
                    isShowingUnlockInput = true;
                }
            });
            
            // 取消解锁按钮
            document.getElementById('cancel-unlock-btn').addEventListener('click', () => {
                document.getElementById('unlock-input-group').style.display = 'none';
                document.getElementById('unlock-error').style.display = 'none';
                document.getElementById('unlock-password').value = '';
                document.getElementById('unlock-btn').style.display = 'block';
                isShowingUnlockInput = false;
            });
            
            // 确认解锁
            document.getElementById('confirm-unlock').addEventListener('click', confirmUnlock);
            
            // 关闭弹窗
            document.getElementById('close-hangup-modal').addEventListener('click', () => {
                document.getElementById('hangup-modal').style.display = 'none';
            });
            
            // 取消挂机
            document.getElementById('cancel-hangup').addEventListener('click', () => {
                document.getElementById('hangup-modal').style.display = 'none';
            });
            
            // 开始挂机
            document.getElementById('start-hangup').addEventListener('click', startHangup);
            
            // 留言输入框字数计数
            document.getElementById('hangup-message').addEventListener('input', updateCharCounter);
            
            // 快捷选项
            document.querySelectorAll('input[name="quick-option"]').forEach(radio => {
                radio.addEventListener('change', function() {
                    if (this.checked) {
                        document.getElementById('hangup-message').value = this.value;
                        updateCharCounter();
                    }
                });
            });
            
            // 限制密码输入
            document.getElementById('hangup-password').addEventListener('keydown', restrictPasswordInput);
            document.getElementById('unlock-password').addEventListener('keydown', restrictPasswordInput);
            
            // 解锁密码输入框回车键
            document.getElementById('unlock-password').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    confirmUnlock();
                }
            });
            
            // 防止退出全屏
            document.addEventListener('keydown', (e) => {
                if (isLocked) {
                    const key = e.key.toLowerCase();
                    const isNumber = key >= '0' && key <= '9';
                    const isLetter = key >= 'a' && key <= 'z';
                    
                    if (!isNumber && !isLetter) {
                        if (['escape', 'f11', 'f1', 'f4', 'tab'].includes(key)) {
                            e.preventDefault();
                        }
                    }
                }
            }, true);
            
            // 防止右键菜单
            document.addEventListener('contextmenu', (e) => {
                if (isLocked) {
                    e.preventDefault();
                }
            });
            
            // 点击其他地方隐藏动画选择器
            document.addEventListener('click', (e) => {
                const selector = document.getElementById('animation-selector');
                const animationBtn = document.getElementById('animation-btn');
                
                if (selector.classList.contains('show') && 
                    !selector.contains(e.target) && 
                    !animationBtn.contains(e.target)) {
                    selector.classList.remove('show');
                }
            });
        }

        // 设置动画选择器自动隐藏（15秒）
        function setupSelectorAutoHide() {
            const selector = document.getElementById('animation-selector');
            selector.addEventListener('mouseenter', () => {
                resetSelectorTimer();
            });
            
            selector.addEventListener('mouseleave', () => {
                resetSelectorTimer();
            });
        }

        // 重置选择器隐藏定时器（15秒）
        function resetSelectorTimer() {
            if (hideSelectorTimeout) {
                clearTimeout(hideSelectorTimeout);
            }
            
            hideSelectorTimeout = setTimeout(() => {
                const selector = document.getElementById('animation-selector');
                selector.classList.remove('show');
            }, 15000);
        }

        // 限制密码输入
        function restrictPasswordInput(e) {
            if (e.ctrlKey || e.altKey || e.metaKey) return;
            
            const allowedSpecialKeys = ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab'];
            if (allowedSpecialKeys.includes(e.key)) return;
            
            const key = e.key.toLowerCase();
            const isNumber = key >= '0' && key <= '9';
            const isLetter = key >= 'a' && key <= 'z';
            
            if (!isNumber && !isLetter) {
                e.preventDefault();
            }
        }

        // 更新字符计数器
        function updateCharCounter() {
            const input = document.getElementById('hangup-message');
            const counter = document.getElementById('char-counter');
            const length = input.value.length;
            const maxLength = 30;
            
            counter.textContent = `${length}/${maxLength}`;
            
            counter.className = 'char-counter';
            if (length > maxLength * 0.8) {
                counter.classList.add('warning');
            }
            if (length > maxLength) {
                counter.classList.add('error');
                input.value = input.value.substring(0, maxLength);
                counter.textContent = `${maxLength}/${maxLength}`;
            }
        }

        // 语音播报
        function speakTime() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const timeText = `现在是北京时间，${hours}点${minutes}分`;
            speak(timeText);
        }

        function speakDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const week = weekDays[now.getDay()];
            const dateText = `今天是${year}年${month}月${day}日，${week}`;
            speak(dateText);
        }

        function speakAwayMessage() {
            if (hangupMessage && hangupMessage.trim() !== '') {
                const messageText = `机主留言说：${hangupMessage}`;
                speak(messageText);
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 1.0;
                speechSynthesis.speak(utterance);
            }
        }

        // 开始挂机
        function startHangup() {
            const password = document.getElementById('hangup-password').value.trim();
            const message = document.getElementById('hangup-message').value.trim();
            
            if (!password || password.length < 4 || password.length > 8) {
                alert('请输入4-8位数字或字母密码');
                document.getElementById('hangup-password').focus();
                return;
            }
            
            const passwordRegex = /^[a-zA-Z0-9]+$/;
            if (!passwordRegex.test(password)) {
                alert('密码只能包含数字和字母');
                document.getElementById('hangup-password').focus();
                return;
            }
            
            hangupPassword = password.toLowerCase();
            hangupMessage = message;
            
            document.getElementById('hangup-modal').style.display = 'none';
            document.getElementById('hangup-password').value = '';
            
            lockScreen();
            
            localStorage.setItem('hangupPassword', hangupPassword);
            localStorage.setItem('hangupMessage', hangupMessage);
            localStorage.setItem('isLocked', 'true');
        }

        // 锁定屏幕
        function lockScreen() {
            isLocked = true;
            isShowingUnlockInput = false;
            
            isLowPerformanceMode = true;
            
            document.getElementById('hangup-btn').style.display = 'none';
            document.getElementById('animation-btn').style.display = 'none';
            
            document.getElementById('unlock-section').style.display = 'flex';
            
            document.getElementById('animation-selector').classList.remove('show');
            
            const awayMessage = document.getElementById('away-message');
            if (hangupMessage && hangupMessage.trim() !== '') {
                awayMessage.textContent = hangupMessage;
                awayMessage.classList.add('show');
            } else {
                awayMessage.classList.remove('show');
            }
            
            document.getElementById('unlock-btn').style.display = 'block';
            document.getElementById('unlock-btn').textContent = '挂机中，点我解锁！';
            document.getElementById('unlock-btn').classList.add('locked');
            
            document.getElementById('unlock-input-group').style.display = 'none';
            document.getElementById('unlock-error').style.display = 'none';
            document.getElementById('unlock-password').value = '';
            
            // 重新初始化动画（使用低性能模式）
            clearAnimations();
            initAnimation(currentAnimation);
            
            // 全屏前先停止所有可能的动画
            setTimeout(() => {
                enterFullscreen();
                // 全屏后重新渲染UI
                setTimeout(() => {
                    document.body.style.overflow = 'hidden';
                    document.documentElement.style.overflow = 'hidden';
                }, 100);
            }, 100);
            
            document.body.classList.add('locked');
        }

        // 确认解锁
        function confirmUnlock() {
            const inputPassword = document.getElementById('unlock-password').value.trim().toLowerCase();
            const errorElement = document.getElementById('unlock-error');
            
            if (inputPassword === hangupPassword) {
                unlockScreen();
                errorElement.style.display = 'none';
                document.getElementById('unlock-password').value = '';
                document.getElementById('unlock-input-group').style.display = 'none';
                document.getElementById('unlock-btn').style.display = 'block';
                isShowingUnlockInput = false;
            } else {
                errorElement.style.display = 'block';
                document.getElementById('unlock-password').value = '';
                document.getElementById('unlock-password').focus();
                
                const unlockSection = document.getElementById('unlock-section');
                unlockSection.style.transform = 'translateX(10px)';
                setTimeout(() => unlockSection.style.transform = 'translateX(-10px)', 100);
                setTimeout(() => unlockSection.style.transform = 'translateX(0)', 200);
            }
        }

        // 解锁屏幕
        function unlockScreen() {
            isLocked = false;
            isShowingUnlockInput = false;
            
            isLowPerformanceMode = false;
            
            document.getElementById('hangup-btn').style.display = 'block';
            document.getElementById('animation-btn').style.display = 'flex';
            
            document.getElementById('unlock-section').style.display = 'none';
            
            document.getElementById('away-message').classList.remove('show');
            
            const selector = document.getElementById('animation-selector');
            selector.style.display = '';
            
            clearAnimations();
            initAnimation(currentAnimation);
            
            exitFullscreen();
            document.body.classList.remove('locked');
            
            localStorage.removeItem('hangupPassword');
            localStorage.removeItem('hangupMessage');
            localStorage.removeItem('isLocked');
        }

        // 检查锁定状态
        function checkLockState() {
            const storedLocked = localStorage.getItem('isLocked');
            if (storedLocked === 'true') {
                const storedPassword = localStorage.getItem('hangupPassword');
                const storedMessage = localStorage.getItem('hangupMessage');
                if (storedPassword) {
                    hangupPassword = storedPassword;
                    hangupMessage = storedMessage || '';
                    lockScreen();
                }
            }
        }

        // 全屏功能
        function enterFullscreen() {
            const elem = document.documentElement;
            try {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            } catch (err) {
                console.log("全屏模式失败:", err);
            }
        }

        function exitFullscreen() {
            try {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            } catch (err) {
                console.log("退出全屏失败:", err);
            }
        }

        // 页面加载完成
        window.addEventListener('load', init);
    </script>
</body>
</html>
