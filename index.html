<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPAN | 科技工具箱</title>
    <style>
        /* 基础重置与变量定义 */
        :root {
            --primary-color: #0a84ff;
            --secondary-color: #30d158;
            --dark-bg: #0d0d0d;
            --panel-bg: #1a1a1a;
            --text-color: #f5f5f7;
            --key-color: #2c2c2e;
            --key-border: #404044;
            --key-highlight: #636366;
            --glow-color: rgba(10, 132, 255, 0.5);
            --spacing-unit: 20px;
            --border-radius: 12px;
            --key-radius: 8px;
            --font-main: 'Segoe UI', 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-main);
            background: var(--dark-bg);
            color: var(--text-color);
            min-height: 100vh;
            padding: var(--spacing-unit);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }
        
        /* 科技感背景元素 */
        .tech-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            overflow: hidden;
        }
        
        .grid-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(10, 132, 255, 0.1), transparent);
            height: 1px;
            width: 100%;
        }
        
        .grid-line:nth-child(2n) {
            transform: rotate(90deg);
        }
        
        /* 主容器 */
        .container {
            max-width: 1200px;
            width: 100%;
            padding: var(--spacing-unit);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* 标题区域 */
        .header {
            text-align: center;
            margin-bottom: 60px;
            width: 100%;
        }
        
        .logo {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 15px;
            letter-spacing: 1px;
            position: relative;
            display: inline-block;
        }
        
        .logo::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary-color), transparent);
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #aaa;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 25px;
        }
        
        /* 按键网格区域 */
        .keyboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1000px;
            margin-top: 30px;
        }
        
        /* 机械键盘按键样式 */
        .key-button {
            position: relative;
            background: var(--key-color);
            border: none;
            border-radius: var(--key-radius);
            padding: 25px 20px;
            color: var(--text-color);
            font-size: 1.3rem;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 
                0 5px 0 0 var(--key-border),
                0 10px 20px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
            z-index: 1;
        }
        
        /* 按键标签 */
        .key-label {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #fff;
            font-weight: 700;
        }
        
        .key-desc {
            font-size: 0.95rem;
            color: #aaa;
            font-weight: 400;
        }
        
        /* 按键顶部高光 */
        .key-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--key-highlight);
            border-radius: var(--key-radius) var(--key-radius) 0 0;
        }
        
        /* 按键悬停效果 */
        .key-button:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 8px 0 0 var(--key-border),
                0 15px 30px rgba(10, 132, 255, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        
        /* 按键按下效果 */
        .key-button:active {
            transform: translateY(0);
            box-shadow: 
                0 2px 0 0 var(--key-border),
                0 5px 15px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: transform 0.05s, box-shadow 0.05s;
        }
        
        /* 按键发光效果 */
        .key-button:hover::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: var(--key-radius);
            box-shadow: 0 0 20px 5px var(--glow-color);
            z-index: -1;
            animation: pulse 2s infinite;
        }
        
        /* 脉冲动画 */
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 0.9; }
            100% { opacity: 0.6; }
        }
        
        /* 特殊按键颜色 */
        .key-button.pingbao {
            --key-color: #1a2b3c;
            --key-border: #2a3b4c;
            --glow-color: rgba(48, 209, 88, 0.4);
        }
        
        .key-button.bianqian {
            --key-color: #2c1a3c;
            --key-border: #3c2a4c;
            --glow-color: rgba(255, 69, 58, 0.4);
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .keyboard-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 20px;
            }
            
            .logo {
                font-size: 2.8rem;
            }
            
            .subtitle {
                font-size: 1rem;
                letter-spacing: 2px;
            }
            
            .key-button {
                padding: 20px 15px;
            }
            
            .key-label {
                font-size: 1.5rem;
            }
        }
        
        @media (max-width: 480px) {
            .keyboard-grid {
                grid-template-columns: 1fr;
                max-width: 320px;
            }
            
            .logo {
                font-size: 2.2rem;
            }
            
            body {
                padding: 15px;
            }
            
            .header {
                margin-bottom: 40px;
            }
        }
        
        /* 页脚 */
        .footer {
            margin-top: 60px;
            color: #666;
            font-size: 0.9rem;
            text-align: center;
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 800px;
        }
        
        .footer a {
            color: var(--primary-color);
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- 科技感背景网格 -->
    <div class="tech-bg">
        <div class="grid-line" style="top: 20%;"></div>
        <div class="grid-line" style="top: 40%;"></div>
        <div class="grid-line" style="top: 60%;"></div>
        <div class="grid-line" style="top: 80%;"></div>
    </div>
    
    <div class="container">
        <header class="header">
            <h1 class="logo">SPAN</h1>
            <p class="subtitle">高效工具箱</p>
        </header>
        
        <main class="keyboard-grid">
            <a href="pingbao/" class="key-button pingbao">
                <div class="key-label">屏保</div>
                <div class="key-desc">个性化屏幕保护程序</div>
            </a>
            
            <a href="bianqian/" class="key-button bianqian">
                <div class="key-label">便签</div>
                <div class="key-desc">智能便签与备忘录</div>
            </a>
            
            <!-- 可以继续添加更多工具 -->
            <a href="#" class="key-button">
                <div class="key-label">计算器</div>
                <div class="key-desc">高级科学计算器</div>
            </a>
            
            <a href="#" class="key-button">
                <div class="key-label">时钟</div>
                <div class="key-desc">世界时间与计时器</div>
            </a>
            
            <a href="#" class="key-button">
                <div class="key-label">转换器</div>
                <div class="key-desc">单位与格式转换</div>
            </a>
            
            <a href="#" class="key-button">
                <div class="key-label">代码</div>
                <div class="key-desc">代码片段管理器</div>
            </a>
        </main>
        
        <footer class="footer">
            <p>SPAN工具箱 © 2026 | 专为效率而生 | <a href="#">更多工具开发中！</a></p>
        </footer>
    </div>

    <script>
        // 添加按键音效（可选）
        document.querySelectorAll('.key-button').forEach(button => {
            button.addEventListener('mousedown', function() {
                this.style.transform = 'translateY(0)';
            });
            
            button.addEventListener('mouseup', function() {
                this.style.transform = 'translateY(-5px)';
            });
            
            button.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0)';
            });
        });
        
        // 动态网格线生成
        document.addEventListener('DOMContentLoaded', function() {
            const techBg = document.querySelector('.tech-bg');
            const lineCount = 8;
            
            for (let i = 0; i < lineCount; i++) {
                const line = document.createElement('div');
                line.className = 'grid-line';
                line.style.top = `${(i + 1) * (100 / (lineCount + 1))}%`;
                techBg.appendChild(line);
            }
        });
    </script>
</body>
</html>
